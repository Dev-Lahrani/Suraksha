<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Suraksha — Climate Early Warning for India</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <style>
    :root {
      --bg: #0b1220; --panel: #111a2e; --border: #1f2b47; --text: #e6edf7;
      --muted: #8b9bb8; --teal: #14b8a6; --low: #22c55e; --mod: #eab308; --high: #ef4444;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); }
    #map { position: absolute; inset: 0; }
    .panel { position: absolute; background: rgba(17, 26, 46, .96); border: 1px solid var(--border); border-radius: 14px; backdrop-filter: blur(6px); }
    header#topbar { position: absolute; top: 12px; left: 12px; z-index: 5; display: flex; gap: 10px; align-items: center; padding: 10px 14px; }
    header#topbar h1 { font-size: 16px; margin: 0; letter-spacing: .4px; }
    header#topbar .tag { font-size: 11px; color: var(--muted); border: 1px solid var(--border); padding: 3px 8px; border-radius: 999px; }
    #legend { left: 12px; bottom: 12px; z-index: 5; padding: 10px 12px; font-size: 12px; display: flex; gap: 12px; align-items: center; }
    .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    #side { top: 68px; right: 12px; width: 380px; max-height: calc(100% - 90px); overflow: auto; z-index: 6; padding: 16px; display: none; }
    #side h2 { margin: 0 0 2px; font-size: 20px; }
    #side .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
    .badges { display: flex; gap: 8px; margin: 10px 0; }
    .badge { flex: 1; text-align: center; padding: 8px 6px; border-radius: 10px; background: var(--bg); border: 1px solid var(--border); }
    .badge .b-val { font-size: 20px; font-weight: 700; }
    .badge .b-lab { font-size: 11px; color: var(--muted); }
    .chip { font-size: 11px; padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
    .chip.low { background: #14351f; color: #4ade80; } .chip.moderate { background: #3a2f10; color: #facc15; }
    .chip.high { background: #3b1516; color: #f87171; } .chip.unknown { background: #1c2540; color: var(--muted); }
    .btns { display: flex; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
    button { background: var(--teal); border: none; color: #04211f; font-weight: 700; padding: 8px 12px; border-radius: 9px; cursor: pointer; font-size: 12px; }
    button.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
    #advisory { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 10px; font-size: 13px; white-space: pre-wrap; line-height: 1.45; }
    .ml-note { margin-top: 8px; background: #171230; border: 1px dashed #6d28d9; color: #c4b5fd; border-radius: 10px; padding: 8px 10px; font-size: 12px; white-space: pre-wrap; line-height: 1.45; }
    #chat { right: 12px; bottom: 12px; width: 340px; z-index: 7; overflow: hidden; }
    #chat-head { padding: 10px 14px; font-weight: 700; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    #chat-body { padding: 0 12px 12px; }
    #chat-log { max-height: 240px; overflow: auto; display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
    .msg { padding: 8px 10px; border-radius: 10px; font-size: 13px; line-height: 1.4; max-width: 90%; white-space: pre-wrap; }
    .msg.user { align-self: flex-end; background: var(--teal); color: #04211f; }
    .msg.bot { align-self: flex-start; background: var(--bg); border: 1px solid var(--border); }
    #chat-form { display: flex; gap: 6px; }
    #chat-input { flex: 1; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 9px; padding: 8px 10px; font-size: 13px; }
    .spinner { font-size: 12px; color: var(--muted); }
    @media (max-width: 720px) { #side { width: calc(100% - 24px); } #chat { width: calc(100% - 24px); } }
  </style>
</head>
<body>
  <div id="map"></div>

  <header id="topbar" class="panel">
    <h1>🛡️ Suraksha</h1>
    <span class="tag">AI for Climate Action · SDG 13</span>
    <span class="tag" id="count-tag">— districts</span>
  </header>

  <div id="legend" class="panel">
    <span><span class="dot" style="background:var(--high)"></span>High ≥ 60</span>
    <span><span class="dot" style="background:var(--mod)"></span>Moderate 25–59</span>
    <span><span class="dot" style="background:var(--low)"></span>Low &lt; 25</span>
  </div>

  <aside id="side" class="panel">
    <h2 id="d-name">—</h2>
    <div class="sub" id="d-sub">—</div>
    <div class="badges">
      <div class="badge"><div class="b-val" id="b-heat">–</div><div class="b-lab">🔥 Heat</div><span class="chip unknown" id="c-heat">—</span></div>
      <div class="badge"><div class="b-val" id="b-flood">–</div><div class="b-lab">🌊 Flood</div><span class="chip unknown" id="c-flood">—</span></div>
      <div class="badge"><div class="b-val" id="b-air">–</div><div class="b-lab">😷 Air</div><span class="chip unknown" id="c-air">—</span></div>
    </div>
    <div class="btns">
      <button id="btn-voice">▶ Voice advisory</button>
      <button id="btn-pdf" class="ghost">⬇ PDF brief</button>
      <button id="btn-forecast" class="ghost">🗓️ 7-day</button>
    </div>
    <div id="advisory">Loading…</div>
    <div id="ml-note" class="ml-note" style="display:none"></div>
    <div style="margin-top:10px"><canvas id="chart" height="180"></canvas></div>
  </aside>

  <section id="chat" class="panel">
    <div id="chat-head"><span>💬 Ask Suraksha</span><span id="chat-toggle">–</span></div>
    <div id="chat-body">
      <div id="chat-log"></div>
      <form id="chat-form">
        <input id="chat-input" placeholder="Try: नागपुर में बाढ़ का खतरा?" autocomplete="off" />
        <button type="submit">➤</button>
      </form>
    </div>
  </section>

  <script src="/app.js"></script>
</body>
</html>
