services:
  - type: web
    name: suraksha
    env: docker
    # A persistent disk requires a paid plan. On the free plan SQLite data
    # (subscribers, alert log, models) is lost on every deploy/restart; use a
    # managed Postgres DATABASE_URL instead if you stay on free.
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: suraksha-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: PORT
        value: 8000
      - key: WEB_CONCURRENCY
        value: 1
      - key: DATABASE_URL
        value: sqlite:////app/data/suraksha.db
      - key: ADMIN_API_KEY
        generateValue: true
      - key: MODEL_SIGNING_KEY
        generateValue: true
      # Optional — set in the Render dashboard (sync: false keeps them private).
      # - key: NUGEN_API_KEY
      # - key: WHATSAPP_TOKEN
      # - key: WHATSAPP_PHONE_NUMBER_ID
      # - key: WHATSAPP_APP_SECRET   (required once WhatsApp is configured)
      # - key: WHATSAPP_VERIFY_TOKEN
      # - key: WHATSAPP_ALERT_TEMPLATE  (approved template with one body variable)
